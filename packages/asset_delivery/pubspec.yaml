name: asset_delivery
description: "Android-only fork of asset_delivery for Play Asset Delivery. iOS omitted because this app bundles audio assets."
version: 1.1.0+android.1
publish_to: 'none'

environment:
  sdk: ^3.5.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.github.mohsenmotlagh.asset_delivery
        pluginClass: AssetDeliveryPlugin
